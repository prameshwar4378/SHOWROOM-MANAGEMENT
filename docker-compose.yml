version: '3.8'

services:
  web:
    build: .
    container_name: showroom_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --workers 3 --threads 2 --bind 0.0.0.0:8000 --timeout 120 SHOWROOM_MANAGEMENT.wsgi:application"
    volumes:
      - showroom_media:/app/media
      - showroom_db:/app/db_data
      - showroom_logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - whatsapp_bridge

  whatsapp_bridge:
    build:
      context: ./whatsapp_bridge
      dockerfile: Dockerfile
    container_name: showroom_whatsapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth

volumes:
  showroom_media:
  showroom_db:
  showroom_logs:
  whatsapp_auth:
