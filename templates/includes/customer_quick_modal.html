<!-- Quick Register New Customer Dialog Modal (Reusable Component) -->
<div x-show="showCustomerModal" x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     role="dialog" aria-modal="true"
     @keydown.escape.window="closeCustomerModal()">
    
    <!-- Backdrop -->
    <div x-show="showCustomerModal"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="closeCustomerModal()"
         class="fixed inset-0 bg-gray-900/60 backdrop-blur-xs transition-opacity"></div>

    <div class="flex min-h-screen items-center justify-center p-4 text-center sm:p-0">
        <!-- Modal Content Card -->
        <div x-show="showCustomerModal"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
             x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
             class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-gray-200">

            <!-- Modal Header -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-4 text-white flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-white text-base backdrop-blur-xs">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-white">Add New Customer</h3>
                        <p class="text-xs text-blue-100">Customer details will be saved & auto-selected in this document</p>
                    </div>
                </div>
                <button type="button" @click="closeCustomerModal()" class="text-white/80 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors">
                    <i class="fas fa-times text-base"></i>
                </button>
            </div>

            <!-- Modal Body Form -->
            <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <!-- Error messages container -->
                <div x-show="customerErrors && customerErrors.length > 0" x-cloak class="p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 space-y-1">
                    <div class="font-bold flex items-center gap-1.5 text-red-800">
                        <i class="fas fa-exclamation-circle"></i> Please fix the following errors:
                    </div>
                    <ul class="list-disc list-inside space-y-0.5">
                        <template x-for="(err, idx) in customerErrors" :key="idx">
                            <li x-text="err"></li>
                        </template>
                    </ul>
                </div>

                <input type="hidden" name="is_active" value="on">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Full Name -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            Full Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="modal_customer_full_name" x-model="newCustomer.full_name"
                               placeholder="e.g. Ramesh Shankar Patil"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Father's / Husband's Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Father's / Husband's Name</label>
                        <input type="text" x-model="newCustomer.father_name"
                               placeholder="e.g. Shankar Patil"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Primary Mobile -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            Primary Mobile <span class="text-red-500">*</span>
                        </label>
                        <input type="tel" x-model="newCustomer.mobile_primary" maxlength="15"
                               placeholder="10-digit mobile number"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Secondary Mobile -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Secondary Mobile (Optional)</label>
                        <input type="tel" x-model="newCustomer.mobile_secondary" maxlength="15"
                               placeholder="Alternate number"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address (Optional)</label>
                        <input type="email" x-model="newCustomer.email"
                               placeholder="customer@example.com"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Village / Town -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            Village / Town <span class="text-red-500">*</span>
                        </label>
                        <input type="text" x-model="newCustomer.village"
                               placeholder="e.g. Shirwal"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Taluka / Tehsil -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            Taluka / Tehsil <span class="text-red-500">*</span>
                        </label>
                        <input type="text" x-model="newCustomer.taluka"
                               placeholder="e.g. Khandala"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- District -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            District <span class="text-red-500">*</span>
                        </label>
                        <input type="text" x-model="newCustomer.district"
                               placeholder="e.g. Satara"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- State -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            State <span class="text-red-500">*</span>
                        </label>
                        <input type="text" x-model="newCustomer.state"
                               placeholder="e.g. Maharashtra"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- PIN Code -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">PIN Code</label>
                        <input type="text" x-model="newCustomer.pin_code" maxlength="10"
                               placeholder="e.g. 412801"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- Aadhaar -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Aadhaar Number</label>
                        <input type="text" x-model="newCustomer.aadhar_number" maxlength="15"
                               placeholder="12-digit Aadhaar"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>

                    <!-- PAN -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">PAN Number</label>
                        <input type="text" x-model="newCustomer.pan_number" maxlength="15"
                               placeholder="e.g. ABCDE1234F" style="text-transform: uppercase;"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition uppercase">
                    </div>

                    <!-- Bank Name -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Financing / Primary Bank</label>
                        <input type="text" x-model="newCustomer.bank_name"
                               placeholder="e.g. State Bank of India"
                               @keydown.enter.prevent="submitQuickCustomer()"
                               class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-300 rounded-xl shadow-2xs hover:border-slate-400 focus:ring-4 focus:ring-blue-100/60 focus:border-blue-600 focus:outline-none transition">
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex items-center justify-end gap-3">
                <button type="button" @click="closeCustomerModal()"
                        class="px-4 py-2 bg-white border border-slate-300 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50 transition-all shadow-2xs cursor-pointer">
                    Cancel
                </button>
                <button type="button" @click="submitQuickCustomer()" :disabled="isSavingCustomer"
                        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-sm transition-all flex items-center gap-2 focus:ring-4 focus:ring-blue-100 cursor-pointer">
                    <i x-show="!isSavingCustomer" class="fas fa-check text-xs"></i>
                    <i x-show="isSavingCustomer" class="fas fa-spinner fa-spin text-xs" x-cloak></i>
                    <span x-text="isSavingCustomer ? 'Saving Customer...' : 'Save & Select Customer'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
