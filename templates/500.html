<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Showroom Management ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center space-y-6 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-3xl font-black">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Internal Server Error</h2>
            <p class="mt-2 text-sm text-slate-500">
                An unexpected condition was encountered. The error has been logged for review.
            </p>
        </div>
        <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-xs transition-colors">
                <i class="fas fa-home text-xs"></i>
                <span>Return to Dashboard</span>
            </a>
            <a href="javascript:history.back()" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors">
                <i class="fas fa-arrow-left text-xs"></i>
                <span>Go Back</span>
            </a>
        </div>
    </div>
</body>
</html>
