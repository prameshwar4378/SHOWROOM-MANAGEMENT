{% extends 'base.html' %}

{% block title %}Delete Category — {{ object.name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-rose-200/90 p-6 md:p-8 shadow-sm">
    <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mb-4 text-xl shadow-2xs">
        <i class="fas fa-trash-alt"></i>
    </div>
    <h3 class="text-lg font-black text-slate-900 tracking-tight">Delete Expense Category?</h3>
    <p class="text-xs text-slate-500 mt-2 leading-relaxed">
        Are you sure you want to delete category <strong class="text-slate-800">{{ object.name }}</strong>?
    </p>

    <form method="post" class="mt-6 flex items-center gap-3">
        {% csrf_token %}
        <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-xs cursor-pointer">
            Yes, Delete Category
        </button>
        <a href="{% url 'expenses:category_list' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition cursor-pointer">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
