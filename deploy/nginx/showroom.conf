# ====================================================================
# Nginx Configuration for Tractor Showroom Management System
# Place in: /etc/nginx/sites-available/showroom.conf
# Enable: sudo ln -s /etc/nginx/sites-available/showroom.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
# ====================================================================

# HTTP Server — Redirects to HTTPS (or directly serves if SSL not yet configured)
server {
    listen 80;
    listen [::]:80;
    server_name showroom.yourdomain.com; # <-- Replace with your domain name or server IP

    client_max_body_size 50M;

    # Static files served directly by Nginx with aggressive browser caching
    location /static/ {
        alias /var/www/showroom/SHOWROOM_MANAGEMENT/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # User uploaded media files (customer documents, invoices, tractor photos)
    location /media/ {
        alias /var/www/showroom/SHOWROOM_MANAGEMENT/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # WhatsApp Bridge Gateway (Forward requests to local Node.js server)
    location /whatsapp-gateway/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Application (Gunicorn WSGI)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for heavy PDF generation or large reports
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
